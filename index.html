<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Delivery Log</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Delivery Log" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e1c19" />

  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1e1c19;
      --bg-raised: #252320;
      --glass: rgba(255,255,255,0.07);
      --glass-mid: rgba(255,255,255,0.11);
      --glass-high: rgba(255,255,255,0.16);
      --border: rgba(255,255,255,0.11);
      --border-strong: rgba(255,255,255,0.22);
      --text: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.48);
      --text-hint: rgba(255,255,255,0.26);
      --blur: blur(18px) saturate(1.6);
      --success-bg: rgba(80,180,80,0.15); --success-text: #7ddc7d; --success-border: rgba(80,180,80,0.35);
      --warn-bg: rgba(210,155,40,0.15);   --warn-text: #f0c050;   --warn-border: rgba(210,155,40,0.35);
      --danger-bg: rgba(210,70,60,0.15);  --danger-text: #f07878; --danger-border: rgba(210,70,60,0.35);
      --radius: 12px; --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Lexend', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    .app-header {
      background: rgba(30,28,25,0.7);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .app-title { font-size: 17px; font-weight: normal; color: var(--text); }
    .app-title span { color: var(--text-muted); }
    .header-badge { font-size: 12px; font-family: monospace; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--text-muted); }

    /* Tabs */
    .tabs { display: flex; background: rgba(30,28,25,0.6); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { flex: 1; min-width: 60px; padding: 13px 6px; font-size: 13px; font-family: 'Lexend', sans-serif; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--text); border-bottom-color: rgba(255,255,255,0.7); }

    .content { padding: 20px 16px; max-width: 600px; margin: 0 auto; }

    /* Glass card */
    .card {
      background: var(--glass);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
      position: relative; overflow: hidden;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); }
    .card-label { font-size: 11px; font-family: monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .card-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Step indicator */
    .step-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .step-pill { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
    .step-pill.active { color: var(--text); font-weight: bold; }
    .step-pill.done { color: var(--success-text); }
    .step-num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: monospace; color: var(--text-muted); }
    .step-pill.active .step-num { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); color: var(--text); }
    .step-pill.done .step-num { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); font-size: 13px; }
    .step-line { flex: 1; height: 1px; background: var(--border); }

    /* Fields */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field > label { display: block; font-size: 12px; font-family: monospace; color: var(--text-muted); margin-bottom: 6px; letter-spacing: .03em; }
    .field input:not([type="checkbox"]), .field select {
      width: 100%; padding: 11px 13px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 16px; font-family: 'Lexend', sans-serif;
      background: var(--glass); color: var(--text);
      appearance: none; -webkit-appearance: none; outline: none;
    }
    .field input:not([type="checkbox"]):focus, .field select:focus { border-color: var(--border-strong); background: var(--glass-mid); }
    .field input::placeholder { color: var(--text-hint); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field select { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    .field select option { background: #2a2825; color: var(--text); }

    /* Buttons */
    .btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); font-size: 15px; font-family: 'Lexend', sans-serif; cursor: pointer; border: none; }
    .btn-primary { background: rgba(255,255,255,0.92); color: #1e1c19; font-weight: 500; }
    .btn-primary:active { background: rgba(255,255,255,0.75); }
    .btn-secondary { background: var(--glass); color: var(--text); border: 1px solid var(--border-strong); margin-top: 10px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
    .btn-secondary:active { background: var(--glass-mid); }
    .btn-sm { padding: 6px 12px; font-size: 13px; width: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--glass); color: var(--text-muted); cursor: pointer; font-family: 'Lexend', sans-serif; }
    .btn-sm:active { background: var(--glass-mid); }
    .btn-danger-sm { color: var(--danger-text); border-color: transparent; background: transparent; }

    .err-msg { display: none; color: var(--danger-text); background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }

    /* Delivery banner (step 2 summary) */
    .delivery-banner { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-start; }
    .banner-info { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    .banner-info .row { display: flex; gap: 8px; }
    .banner-key { color: var(--text-muted); font-family: monospace; font-size: 11px; min-width: 52px; }
    .banner-val { font-size: 13px; color: var(--text); }
    .btn-edit { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; font-family: 'Lexend', sans-serif; cursor: pointer; color: var(--text-muted); }

    /* Ingredient picker */
    .storage-group-label { font-size: 12px; font-family: monospace; color: var(--text-muted); margin: 16px 0 8px 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: bold; }
    .ing-picker-card { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 8px; transition: background .15s; }
    .ing-picker-card:active { background: var(--glass-mid); }
    .ing-picker-card.added { border-color: var(--success-border); background: var(--success-bg); }
    .ing-picker-name { font-size: 14px; font-weight: 500; flex: 1; color: var(--text); }
    .ing-picker-count { font-size: 11px; font-family: monospace; color: var(--success-text); background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 20px; padding: 2px 8px; flex-shrink: 0; }
    .ing-picker-empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }

    /* Added lines */
    .lines-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .line-item { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
    .line-n { font-size: 11px; font-family: monospace; color: var(--text-hint); padding-top: 2px; min-width: 16px; }
    .line-body { flex: 1; min-width: 0; }
    .line-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; color: var(--text); }
    .line-meta { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    .btn-remove { background: transparent; border: none; font-size: 20px; color: var(--text-hint); cursor: pointer; padding: 0 4px; line-height: 1; }
    .btn-remove:active { color: var(--danger-text); }

    .check-tag { font-size: 11px; font-family: monospace; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-muted); }
    .check-tag-ok { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
    .check-tag-fail { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }

    .checks-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .check-box { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 13px; cursor: pointer; flex: 1; }
    .check-box.checked { background: var(--success-bg); border-color: var(--success-border); }
    .check-box input { width: 16px; height: 16px; accent-color: var(--success-text); }
    .check-box span { font-size: 13px; color: var(--text); }
    .check-warn { font-size: 12px; color: var(--warn-text); display: none; margin-top: 8px; }

    .save-row { display: flex; flex-direction: column; gap: 8px; }
    .line-count { font-size: 12px; font-family: monospace; color: var(--text-muted); text-align: center; margin-top: 8px; }

    /* ── Records ── */
    .records-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .search-box { flex: 1; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Lexend', sans-serif; background: var(--glass); color: var(--text); outline: none; }
    .search-box::placeholder { color: var(--text-hint); }
    .search-box:focus { border-color: var(--border-strong); }
    .btn-refresh { display: flex; align-items: center; gap: 5px; padding: 10px 14px; font-size: 13px; font-family: 'Lexend', sans-serif; background: var(--glass); color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn-refresh:active { background: var(--glass-mid); }
    .btn-refresh.spinning { color: var(--warn-text); }

    .sheets-status-bar { font-size: 12px; font-family: monospace; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .sheets-status-bar.error { color: var(--danger-text); }

    /* Collapsible delivery rows */
    .delivery-group { margin-bottom: 8px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
    .delivery-group.is-unsynced { border-color: var(--warn-border); }

    .delivery-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--glass); cursor: pointer; user-select: none; position: relative; overflow: hidden; }
    .delivery-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent); }
    .delivery-header:active { background: var(--glass-mid); }
    .delivery-group.is-unsynced .delivery-header { background: var(--warn-bg); }

    .delivery-chevron { font-size: 11px; color: var(--text-hint); flex-shrink: 0; transition: transform .2s; }
    .delivery-chevron.open { transform: rotate(90deg); }

    .delivery-header-body { flex: 1; min-width: 0; }
    .delivery-header-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .delivery-date { font-size: 15px; font-weight: 500; color: var(--text); }
    .delivery-meta { font-size: 12px; color: var(--text-muted); font-family: monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .delivery-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .line-pill { font-size: 11px; font-family: monospace; color: var(--text-muted); background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }

    .delivery-lines-wrap { display: none; }
    .delivery-lines-wrap.open { display: block; }
    .delivery-lines-inner { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.15); }
    .delivery-group.is-unsynced .delivery-lines-inner { border-top-color: var(--warn-border); }

    .line-record { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; }
    .lr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .lr-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .lr-meta { font-size: 12px; color: var(--text-muted); font-family: monospace; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .lr-checks { display: flex; gap: 5px; flex-wrap: wrap; }

    .delivery-footer { padding: 10px 14px 12px; border-top: 1px solid var(--warn-border); background: var(--warn-bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .delivery-footer-msg { font-size: 12px; color: var(--warn-text); }
    .btn-sync-one { padding: 7px 16px; font-size: 13px; font-family: 'Lexend', sans-serif; background: rgba(255,255,255,0.92); color: #1e1c19; font-weight: 500; border: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
    .btn-sync-one:disabled { opacity: .5; cursor: not-allowed; }

    .sync-all-bar { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sync-all-bar span { font-size: 13px; color: var(--warn-text); }
    .btn-sync-all { padding: 7px 14px; font-size: 13px; font-family: 'Lexend', sans-serif; background: rgba(255,255,255,0.92); color: #1e1c19; font-weight: 500; border: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
    .btn-sync-all:disabled { opacity: .5; cursor: not-allowed; }

    .badge { font-size: 11px; font-family: monospace; padding: 2px 7px; border-radius: 20px; border: 1px solid; }
    .badge-ok { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
    .badge-exp { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
    .badge-unsynced { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }

    .empty { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    .empty .icon { font-size: 32px; margin-bottom: 10px; }

    /* Ingredients & Suppliers */
    .ing-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .ing-add-row input { flex: 1; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: 'Lexend', sans-serif; background: var(--glass); color: var(--text); outline: none; }
    .ing-add-row input::placeholder { color: var(--text-hint); }
    .ing-add-row input:focus { border-color: var(--border-strong); }
    .btn-add-ing { padding: 11px 18px; background: rgba(255,255,255,0.92); color: #1e1c19; font-weight: 500; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: 'Lexend', sans-serif; cursor: pointer; white-space: nowrap; }

    .ing-count { font-size: 12px; font-family: monospace; color: var(--text-muted); margin-bottom: 12px; }

    .ing-item { display: flex; align-items: flex-start; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; margin-bottom: 6px; gap: 10px; }
    .ing-item-photo { width: 40px; height: 40px; border-radius: 6px; background: var(--glass-mid); border: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
    .ing-item-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
    .ing-item-body { flex: 1; min-width: 0; }
    .ing-item-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
    .ing-item-suppliers { display: flex; flex-wrap: wrap; gap: 3px; }
    .ing-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .supplier-tag { display: inline-block; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; font-size: 11px; font-family: monospace; color: var(--text-muted); }
    .supplier-tag.linked { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .ing-empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px; font-family: monospace; }

    .supplier-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 6px; gap: 10px; }
    .supplier-item-name { flex: 1; font-size: 14px; color: var(--text); }

    .supplier-list-scroll { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; background: rgba(0,0,0,0.2); }
    .supplier-check-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--glass); cursor: pointer; margin-bottom: 6px; }
    .supplier-check-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--success-text); flex-shrink: 0; appearance: auto; -webkit-appearance: auto; cursor: pointer; margin: 0; padding: 0; border: none; }
    .supplier-check-row span { font-size: 14px; color: var(--text); }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: none; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: rgba(28,26,23,0.85);
      backdrop-filter: blur(28px) saturate(1.5); -webkit-backdrop-filter: blur(28px) saturate(1.5);
      border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
      padding: 20px; width: 100%; max-height: 85vh; overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; color: var(--text); }
    .modal-close { font-size: 22px; color: var(--text-muted); background: none; border: none; cursor: pointer; line-height: 1; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--glass-high); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border-strong); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header class="app-header">
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="Logo.png" alt="Logo" style="height:32px;object-fit:contain;"/>
    <div class="app-title">Delivery <span>Log</span></div>
  </div>
  <div class="header-badge" id="sync-status">● sheets</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('entry')" id="tab-entry">New Delivery</button>
  <button class="tab" onclick="showTab('records')" id="tab-records">Records (<span id="rec-count">0</span>)</button>
  <button class="tab" onclick="showTab('ingredients')" id="tab-ingredients">Ingredients</button>
  <button class="tab" onclick="showTab('suppliers')" id="tab-suppliers">Suppliers</button>
</div>

<div class="content">
  <!-- ── ENTRY PANEL ── -->
  <div id="panel-entry">
    <div class="step-row">
      <div class="step-pill active" id="sp1"><div class="step-num" id="sn1">1</div> Delivery details</div>
      <div class="step-line"></div>
      <div class="step-pill" id="sp2"><div class="step-num" id="sn2">2</div> Add ingredients</div>
    </div>

    <!-- Step 1 -->
    <div id="step1">
      <div class="card">
        <div class="card-label">Delivery details</div>
        <div class="field"><label>Delivery date</label><input type="date" id="h-date" /></div>
        <div class="field"><label>Invoice number</label><input type="text" id="h-invoice" placeholder="e.g. 009111111" /></div>
        <div class="field">
          <label>Supplier</label>

      </div>

    <!-- Step 2 -->
    <div id="step2" style="display:none;">
      <div class="delivery-banner">
        <div class="banner-info" id="banner-text"></div>
        <button class="btn-edit" onclick="goStep1()">Edit</button>

  <!-- ── RECORDS PANEL ── -->
  <div id="panel-records" style="display:none;">
    <div class="records-toolbar">
      <input type="search" class="search-box" id="search-q" placeholder="Search ingredient, invoice, staff…" oninput="renderRecords()" />

  <!-- ── INGREDIENTS PANEL ── -->
  <div id="panel-ingredients" style="display:none;">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">

      </div>

      <div id="ing-list"></div>

  <!-- ── SUPPLIERS PANEL ── -->
  <div id="panel-suppliers" style="display:none;">
    <div class="card">

        <button class="btn-add-ing" id="btn-add-sup" onclick="addSupplier()">Add</button>
      </div>
      <div class="err-msg" id="err-sup"></div>

</div>

<!-- Ingredient detail sheet (for deliveries) -->
<div class="modal-overlay" id="ing-detail-overlay" onclick="closeIngDetail()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">
      <div id="detail-ing-name" style="display:flex;align-items:center;gap:10px;"></div>
      <button class="modal-close" onclick="closeIngDetail()">×</button>
    </div>
    <div style="height:14px;"></div>
    <div class="field-row">
      <div class="field"><label>Batch number</label><input type="text" id="l-batch" placeholder="e.g. BATCH-001" /></div>
      <div class="field" id="ubd-field-container"><label>Use by date</label><input type="date" id="l-ubd" /></div>

      <label>Quantity</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="l-qty" placeholder="e.g. 5" style="flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:'Lexend',sans-serif;background:var(--surface);color:var(--text);appearance:none;outline:none;" />
        <select id="l-unit" style="width:110px;padding:11px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Lexend',sans-serif;background:var(--surface);color:var(--text);appearance:none;outline:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%228%22 viewBox=%220 0 12 8%22><path d=%22M1 1l5 5 5-5%22 stroke=%22%237a776e%22 stroke-width=%221.5%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>');background-repeat:no-repeat;background-position:right 10px center;">
          <option value="Cases">Cases</option>
          <option value="Units">Units</option>
          <option value="kg">kg</option>
          <option value="Litres">Litres</option>
        </select>

    <div class="checks-row">
      <label class="check-box" id="cb-condition-wrap">
        <input type="checkbox" id="l-condition" onchange="toggleCheck('cb-condition-wrap',this)" />
        <span>Good condition</span>
      </label>
      <label class="check-box" id="cb-storage-wrap">
        <input type="checkbox" id="l-storage" onchange="toggleCheck('cb-storage-wrap',this)" />
        <span>Correct storage</span>
      </label>
    </div>
    <div class="check-warn" id="check-warn">⚠ Please confirm both checks before adding.</div>
    <div class="err-msg" id="err2" style="margin-top:8px;"></div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="addLine()">+ Add this ingredient</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzu3MokzEDHnYyO0I8FqIVi0UkI5DkJOwNNW-YmdIchDkw75aoksUvHFLRJmi3tm9aD/exec';
  const STOCK_CHECK_URL = 'https://script.google.com/macros/s/AKfycbx8donnPrSqM5aI5d8dMSMIBdOWuITzljNxTRj46div5S_VfuvODutQhQGUcHHXN5bJ_A/exec';
  const SK_DELIVERIES = 'delivery_records_v3';
  const SK_SUPPLIERS  = 'delivery_suppliers_v1';

  let deliveries = [], ingredients = [], allSuppliers = [], ingredientPhotos = {};
  let header = null, lines = [], selectedIngredient = null, editingIngredient = null;

  // Sheets-backed records state
  let sheetsDeliveries = [];   // deliveries fetched from Google Sheets
  let sheetsFetched = false;   // has a successful fetch happened this session?
  let sheetsFetching = false;
  let expandedKeys = new Set();

  // ── Boot ──
  async function load() {
    try { const d = localStorage.getItem(SK_DELIVERIES); if(d) deliveries = JSON.parse(d); } catch(e){}
    try { const s = localStorage.getItem(SK_SUPPLIERS);  if(s) allSuppliers = JSON.parse(s); } catch(e){}
    updateCount();
    populateSupplierDropdown();
    await Promise.all([fetchIngredients(), fetchIngredientPhotos(), fetchSuppliers()]);
    renderSuppliersList();
    populateSupplierDropdown();
  }

  function persist() { try { localStorage.setItem(SK_DELIVERIES, JSON.stringify(deliveries)); } catch(e){} }
  function persistSuppliers() { localStorage.setItem(SK_SUPPLIERS, JSON.stringify(allSuppliers)); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function updateCount() { document.getElementById('rec-count').textContent = deliveries.reduce((s,d) => s + d.lines.length, 0); }
  function fmt(d) {
    if (!d) return '—';
    const s = String(d).slice(0, 10); // take only yyyy-mm-dd, drop any trailing time
    const p = s.split('-');
    return p.length === 3 && p[0].length === 4 ? p[2] + '/' + p[1] + '/' + p[0] : s;
  }

  function expiryStatus(ubd) {
    if(!ubd) return 'ok';
    const diff = Math.floor((new Date(ubd) - new Date().setHours(0,0,0,0)) / 86400000);
    return diff < 0 ? 'exp' : diff <= 3 ? 'warn' : 'ok';
  }

  function expiryBadge(ubd) {
    const s = expiryStatus(ubd);
    if(s === 'exp') return '<span class="badge badge-exp">EXPIRED</span>';
    if(s === 'warn') return '<span class="badge badge-warn">EXPIRING</span>';
    return '<span class="badge badge-ok">VALID</span>';
  }

  function updateSyncStatus(state) {
    const el = document.getElementById('sync-status');
    if(state === 'syncing') { el.textContent = '◌ syncing'; el.style.color = '#8a6500'; }
    else if(state === 'synced') { el.textContent = '✓ synced'; el.style.color = '#2d6e2d'; }
    else if(state === 'error') { el.textContent = '✗ error'; el.style.color = '#c0392b'; }
    else { el.textContent = '● sheets'; el.style.color = '#2d6e2d'; }
  }

  // Unique key per delivery — used to match local records against Sheets
  function deliveryKey(d) {
    return [d.date, d.invoice, d.supplier, d.staff].join('|');
  }

  // ── Fetch deliveries from Sheets ──
  async function fetchSheetDeliveries() {
    if(sheetsFetching) return;
    sheetsFetching = true;

    const btn = document.getElementById('btn-refresh');
    if(btn) { btn.classList.add('spinning'); btn.textContent = '↻ Loading…'; }
    updateSyncStatus('syncing');
    setStatusBar('loading', 'Fetching from Google Sheets…');

    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=getDeliveries');
      const json = await res.json();

      if(json.records && Array.isArray(json.records)) {
        // Group flat rows back into delivery objects keyed by date+invoice+supplier+staff
        const map = {};
        json.records.forEach(row => {
          const key = [row.date, row.invoice, row.supplier, row.staff].join('|');
          if(!map[key]) {
            map[key] = {
              date: row.date, invoice: row.invoice,
              supplier: row.supplier, staff: row.staff,
              savedAt: row.savedAt || '', lines: []
            };
          }
          map[key].lines.push({
            ingredient: row.ingredient, batch: row.batch,
            ubd: row.ubd || '', qty: row.qty, unit: row.unit,
            condition: row.condition === 'Yes' || row.condition === true,
            storage:   row.storage   === 'Yes' || row.storage   === true,
            isPackaging: row.isPackaging === 'TRUE' || row.isPackaging === true || row.isPackaging === 'true'
          });
        });
        sheetsDeliveries = Object.values(map)
          .sort((a,b) => b.date.localeCompare(a.date) || b.savedAt.localeCompare(a.savedAt));

        // Reconcile local synced flags
        const sheetsKeys = new Set(sheetsDeliveries.map(deliveryKey));
        let changed = false;
        deliveries.forEach((d, i) => {
          const nowSynced = sheetsKeys.has(deliveryKey(d));
          if(d.synced !== nowSynced) { deliveries[i].synced = nowSynced; changed = true; }
        });
        if(changed) persist();

        sheetsFetched = true;
        const total = sheetsDeliveries.reduce((s,d) => s + d.lines.length, 0);
        setStatusBar('ok', `${sheetsDeliveries.length} deliveries · ${total} lines in Sheets`);
        updateSyncStatus('synced');
        setTimeout(() => updateSyncStatus('sheets'), 3000);
      } else {
        throw new Error('Unexpected response');
      }
    } catch(e) {
      setStatusBar('error', 'Could not reach Sheets — showing local records');
      updateSyncStatus('error');
      setTimeout(() => updateSyncStatus('sheets'), 3000);
    }

    sheetsFetching = false;
    if(btn) { btn.classList.remove('spinning'); btn.textContent = '↻ Refresh'; }
    renderRecords();
  }

  function setStatusBar(type, msg) {
    const bar = document.getElementById('sheets-status-bar');
    bar.style.display = msg ? 'flex' : 'none';
    bar.className = 'sheets-status-bar' + (type === 'error' ? ' error' : '');
    bar.textContent = msg;
  }

  async function refreshFromSheets() {
    await fetchSheetDeliveries();
  }

  // ── Fetch ──
  async function fetchIngredients() {
    document.getElementById('tab-ingredients').textContent = 'Ingredients…';
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=getIngredients');
      const json = await res.json();
      if (json.ingredients) {
        ingredients = json.ingredients
          .filter(i => i)
          .map(i => typeof i === 'string' ? { name: i, suppliers: [] } : i)
          .map(i => {
            if (typeof i.suppliers === 'string') {
              i.suppliers = i.suppliers ? i.suppliers.split(',').map(s => s.trim()) : [];
            }
            if (!Array.isArray(i.suppliers)) i.suppliers = [];
            i.storageType = i.storageType || 'Ambient';
            i.icon = i.icon || '';
            return i;
          })
          .sort((a,b) => a.name.localeCompare(b.name));

        ingredients.forEach(i => (i.suppliers||[]).forEach(s => { if(s && !allSuppliers.includes(s)) allSuppliers.push(s); }));
        allSuppliers.sort();
        persistSuppliers();
      }
    } catch(e) {}
    document.getElementById('tab-ingredients').textContent = 'Ingredients';
    renderIngredients();
    populateSupplierDropdown();
    renderSuppliersList();
  }

  async function fetchSuppliers() {
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=getSuppliers');
      const json = await res.json();
      if (json.suppliers && Array.isArray(json.suppliers)) {
        json.suppliers.forEach(s => {
          if (s && !allSuppliers.includes(s)) allSuppliers.push(s);
        });
        allSuppliers.sort();
        persistSuppliers();
      }
    } catch(e) {}
  }

  async function fetchIngredientPhotos() {
    try {
      const res = await fetch(STOCK_CHECK_URL + '?action=getIngredients');
      const json = await res.json();
      if (json.ingredients) {
        ingredientPhotos = {};
        json.ingredients.forEach(i => { if(i.photo) ingredientPhotos[i.name] = i.photo; });
      }
    } catch(e) {}
  }

  // ── Tabs ──
  function showTab(t) {
    ['entry','records','ingredients','suppliers'].forEach(p => {
      document.getElementById('panel-' + p).style.display = p === t ? '' : 'none';
      document.getElementById('tab-' + p).classList.toggle('active', p === t);
    });
    if(t === 'records') {
      renderRecords();
      if(!sheetsFetched && !sheetsFetching) fetchSheetDeliveries();
    }
    if(t === 'ingredients') renderIngredients();
    if(t === 'suppliers') renderSuppliersList();
  }

  // ── Step navigation ──
  function setStep(n) {
    document.getElementById('sp1').className = 'step-pill' + (n === 1 ? ' active' : ' done');
    document.getElementById('sn1').textContent = n === 1 ? '1' : '✓';
    document.getElementById('sp2').className = 'step-pill' + (n === 2 ? ' active' : '');
    document.getElementById('sn2').textContent = '2';
  }

  function goStep1() {
    document.getElementById('step1').style.display = '';
    document.getElementById('step2').style.display = 'none';
    setStep(1);
  }

  function goStep2() {
    const date = document.getElementById('h-date').value;
    const invoice = document.getElementById('h-invoice').value.trim();
    const supplier = document.getElementById('h-supplier').value;
    const staff = document.getElementById('h-staff').value.trim();

    const missing = [];
    if(!date) missing.push('delivery date');
    if(!invoice) missing.push('invoice number');
    if(!supplier) missing.push('supplier');
    if(!staff) missing.push('staff name');

    const err = document.getElementById('err1');
    if(missing.length) { err.style.display = ''; err.textContent = 'Please fill in: ' + missing.join(', '); return; }
    err.style.display = 'none';

    header = { date, invoice, supplier, staff };
    lines = [];
    document.getElementById('banner-text').innerHTML =
      `<div class="row"><div class="banner-key">Date</div><div class="banner-val">${fmt(date)}</div></div>`+
      `<div class="row"><div class="banner-key">Invoice</div><div class="banner-val">${invoice}</div></div>`+
      `<div class="row"><div class="banner-key">Supplier</div><div class="banner-val">${supplier}</div></div>`+
      `<div class="row"><div class="banner-key">Staff</div><div class="banner-val">${staff}</div></div>`;

    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = '';
    setStep(2);
    renderLines();
    renderIngPicker();
  }

  // ── Ingredient picker (Step 2) ──
  function getFilteredIngredients() {
    const supplier = header ? header.supplier.trim().toLowerCase() : '';
    if(!supplier) return ingredients;
    return ingredients.filter(ing => {
      const sup = ing.suppliers || [];
      return sup.length === 0 || sup.some(s => s.toLowerCase() === supplier);
    });
  }

  function renderIngPicker() {
    const pool = getFilteredIngredients();
    const grid = document.getElementById('ing-picker-grid');
    const label = document.getElementById('ing-picker-label');

    if(!pool.length) {
      const supplier = header ? header.supplier : 'this supplier';
      grid.innerHTML = `<div class="ing-picker-empty">No ingredients linked to <strong>${supplier}</strong> yet.<br><span style="font-size:13px;">Go to the Ingredients tab to add or link ingredients.</span></div>`;
      if(label) label.style.display = 'none';
      return;
    }

    if(label) label.style.display = '';
    const counts = {};
    lines.forEach(l => { counts[l.ingredient] = (counts[l.ingredient]||0) + 1; });

    const groups = ['Fridge', 'Freezer', 'Ambient', 'Packaging'];
    let html = '';

    groups.forEach(group => {
      const items = pool.filter(ing => (ing.storageType || 'Ambient') === group);
      if (items.length > 0) {
        const icon = group === 'Fridge' ? '🧊' : group === 'Freezer' ? '❄️' : group === 'Packaging' ? '🛍️' : '📦';
        html += `<div class="storage-group-label">${icon} ${group}</div>`;
        html += items.map(ing => {
          const count = counts[ing.name] || 0;
          const addedClass = count > 0 ? ' added' : '';
          const countBadge = count > 0 ? `<span class="ing-picker-count">×${count} added</span>` : '';
          const photo = ingredientPhotos[ing.name];
          const fallbackEmoji = ing.storageType === 'Packaging' ? '📦' : '🥫';

          let photoHtml = '';
          if (ing.icon && ing.icon.startsWith('http')) {
            photoHtml = `<img src="${ing.icon}" onerror="this.style.display='none'" style="width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" />`;
          } else if (ing.icon) {
            photoHtml = `<div style="width:44px;height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;">${ing.icon}</div>`;
          } else if (photo) {
            photoHtml = `<img src="${photo}" onerror="this.style.display='none'" style="width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" />`;
          } else {
            photoHtml = `<div style="width:44px;height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${fallbackEmoji}</div>`;
          }

          return `<div class="ing-picker-card${addedClass}" onclick="openIngDetail('${ing.name.replace(/'/g,"\\'")}')">
            ${photoHtml}
            <div class="ing-picker-name">${ing.name}</div>
            ${countBadge}
          </div>`;
        }).join('');
      }
    });

    grid.innerHTML = html;
  }

  function openIngDetail(ingName) {
    selectedIngredient = ingName;
    const photo = ingredientPhotos[ingName];
    const nameEl = document.getElementById('detail-ing-name');
    nameEl.innerHTML = (photo
      ? `<img src="${photo}" onerror="this.style.display='none'" style="width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--border);" />`
      : '') + `<span>${ingName}</span>`;

    const ing = ingredients.find(i => i.name === ingName);
    const isPkg = ing && ing.storageType === 'Packaging';
    document.getElementById('ubd-field-container').style.display = isPkg ? 'none' : 'block';

    document.getElementById('l-batch').value = '';
    document.getElementById('l-ubd').value = '';
    document.getElementById('l-qty').value = '';
    document.getElementById('l-unit').value = 'Cases';
    document.getElementById('l-condition').checked = false;
    document.getElementById('l-storage').checked = false;
    document.getElementById('cb-condition-wrap').classList.remove('checked');
    document.getElementById('cb-storage-wrap').classList.remove('checked');
    document.getElementById('check-warn').style.display = 'none';
    document.getElementById('err2').style.display = 'none';

    document.getElementById('ing-detail-overlay').classList.add('open');
    setTimeout(() => document.getElementById('l-batch').focus(), 100);
  }

  function closeIngDetail() {
    document.getElementById('ing-detail-overlay').classList.remove('open');
    selectedIngredient = null;
  }

  // ── Lines ──
  function toggleCheck(wrapId, cb) {
    document.getElementById(wrapId).classList.toggle('checked', cb.checked);
    document.getElementById('check-warn').style.display = 'none';
  }

  function renderLines() {
    const c = document.getElementById('lines-list');
    c.innerHTML = lines.map((l,i) => `
      <div class="line-item">
        <div class="line-n">${i+1}</div>
        <div class="line-body">
          <div class="line-name">${l.ingredient}</div>
          <div class="line-meta">Batch: ${l.batch}${l.isPackaging ? '' : ' · UBD: ' + fmt(l.ubd)} · ${l.qty} ${l.unit}</div>
          <div style="display:flex;gap:5px;margin-top:4px;">
            <span class="check-tag ${l.condition ? 'check-tag-ok' : 'check-tag-fail'}">${l.condition ? '✓ Good condition' : '✗ Condition'}</span>
            <span class="check-tag ${l.storage ? 'check-tag-ok' : 'check-tag-fail'}">${l.storage ? '✓ Correct storage' : '✗ Storage'}</span>
          </div>
        </div>
        ${l.isPackaging ? '' : expiryBadge(l.ubd)}
        <button class="btn-remove" onclick="removeLine(${i})">×</button>
      </div>`).join('');

    document.getElementById('save-btn').style.display = lines.length > 0 ? '' : 'none';
    document.getElementById('line-count-label').textContent = lines.length > 0 ? `${lines.length} ingredient line${lines.length !== 1 ? 's' : ''} added` : '';
  }

  function removeLine(i) {
    lines.splice(i, 1);
    renderLines();
    renderIngPicker();
  }

  function addLine() {
    const ingredient = selectedIngredient || '';
    const batch = document.getElementById('l-batch').value.trim();
    const ubd = document.getElementById('l-ubd').value;
    const qty = document.getElementById('l-qty').value.trim();
    const unit = document.getElementById('l-unit').value;
    const condition = document.getElementById('l-condition').checked;
    const storage = document.getElementById('l-storage').checked;

    const ing = ingredients.find(i => i.name === ingredient);
    const isPkg = ing && ing.storageType === 'Packaging';

    const missing = [];
    if(!ingredient) missing.push('ingredient');
    if(!batch) missing.push('batch number');
    if(!isPkg && !ubd) missing.push('use by date');
    if(!qty) missing.push('quantity');

    const err = document.getElementById('err2');
    if(missing.length) { err.style.display = ''; err.textContent = 'Please fill in: ' + missing.join(', '); return; }
    err.style.display = 'none';

    if(!condition || !storage) { document.getElementById('check-warn').style.display = ''; return; }
    document.getElementById('check-warn').style.display = 'none';

    lines.push({ ingredient, batch, ubd: isPkg ? '' : ubd, qty, unit, condition, storage, isPackaging: isPkg });
    closeIngDetail();
    renderLines();
    renderIngPicker();
  }

  // ── Shared sync helper ──
  async function syncDeliveryToSheets(delivery) {
    const rows = delivery.lines.map(l => ({
      date: delivery.date, invoice: delivery.invoice, supplier: delivery.supplier, staff: delivery.staff,
      ingredient: l.ingredient, batch: l.batch, ubd: l.ubd, qty: l.qty, unit: l.unit,
      condition: l.condition ? 'Yes' : 'No', storage: l.storage ? 'Yes' : 'No',
      isPackaging: !!l.isPackaging, savedAt: delivery.savedAt
    }));
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ rows }), headers: { 'Content-Type': 'text/plain' } });
    const json = await res.json();
    if(json.result !== 'success') throw new Error('Server returned non-success');
  }

  async function saveDelivery() {
    if(!lines.length) return;

    const delivery = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      ...header,
      lines: [...lines],
      savedAt: new Date().toISOString(),
      synced: false
    };

    deliveries.unshift(delivery);
    persist();
    updateCount();

    lines = [];
    header = null;
    ['h-invoice','h-staff'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('h-date').valueAsDate = new Date();
    document.getElementById('h-supplier').value = '';

    goStep1();
    showTab('records');
    updateSyncStatus('syncing');

    try {
      await syncDeliveryToSheets(delivery);
      const idx = deliveries.findIndex(d => d.id === delivery.id);
      if(idx >= 0) { deliveries[idx].synced = true; persist(); }
      // Add to sheetsDeliveries so the UI reflects it immediately
      const key = deliveryKey(delivery);
      if(!sheetsDeliveries.some(d => deliveryKey(d) === key)) {
        sheetsDeliveries.unshift({ ...delivery });
      }
      updateSyncStatus('synced');
      setTimeout(() => updateSyncStatus('sheets'), 4000);
      renderRecords();
    } catch(e) {
      updateSyncStatus('error');
      setTimeout(() => updateSyncStatus('sheets'), 4000);
      renderRecords();
    }
  }

  // ── Records ──
  function toggleDelivery(key) {
    if(expandedKeys.has(key)) expandedKeys.delete(key);
    else expandedKeys.add(key);
    renderRecords();
  }

  function byDateDesc(a, b) {
    return new Date(b.date) - new Date(a.date);
  }

  function buildCombinedList() {
    // If we have Sheets data, use it as the base; append local-only unsynced deliveries
    if(sheetsFetched) {
      const sheetsKeySet = new Set(sheetsDeliveries.map(deliveryKey));
      const localOnly = deliveries.filter(d => !sheetsKeySet.has(deliveryKey(d)));
      return [
        ...sheetsDeliveries.map(d => ({ ...d, syncStatus: 'synced' })),
        ...localOnly.map(d => ({ ...d, syncStatus: 'unsynced' }))
      ].sort(byDateDesc);
    }
    // No Sheets data yet — show local records with their cached synced flag
    return deliveries
      .map(d => ({ ...d, syncStatus: d.synced ? 'synced' : 'unsynced' }))
      .sort(byDateDesc);
  }

  function renderRecords() {
    const q = (document.getElementById('search-q').value || '').toLowerCase();
    const c = document.getElementById('records-container');
    const combined = buildCombinedList();

    // Sync-all bar
    const unsynced = combined.filter(d => d.syncStatus === 'unsynced');
    const syncBar = document.getElementById('sync-all-bar');
    if(unsynced.length > 1) {
      syncBar.style.display = 'flex';
      document.getElementById('sync-all-count').textContent = `${unsynced.length} deliveries not synced to Sheets`;
    } else {
      syncBar.style.display = 'none';
    }

    const filtered = combined.map(d => ({
      ...d,
      lines: d.lines.filter(l => !q || [l.ingredient, l.batch, d.invoice, d.supplier, d.staff].some(v => v && v.toLowerCase().includes(q)))
    })).filter(d => d.lines.length > 0);

    if(!filtered.length) {
      c.innerHTML = `<div class="empty"><div class="icon">📋</div>${combined.length ? 'No results match' : sheetsFetching ? 'Loading…' : 'No deliveries yet'}</div>`;
      return;
    }

    c.innerHTML = filtered.map(d => {
      const key = deliveryKey(d);
      const isOpen = expandedKeys.has(key);
      const isUnsynced = d.syncStatus === 'unsynced';
      const safeKey = key.replace(/'/g, "\\'");

      const linesHtml = d.lines.map(l => `
        <div class="line-record">
          <div class="lr-top"><div class="lr-name">${l.ingredient}</div>${l.isPackaging ? '' : expiryBadge(l.ubd)}</div>
          <div class="lr-meta">
            <span>Batch: ${l.batch}</span>
            ${l.isPackaging ? '' : `<span>UBD: ${fmt(l.ubd)}</span>`}
            <span>Qty: ${l.qty} ${l.unit||''}</span>
          </div>
          <div class="lr-checks">
            <span class="check-tag ${l.condition ? 'check-tag-ok' : 'check-tag-fail'}">${l.condition ? '✓ Good condition' : '✗ Condition issue'}</span>
            <span class="check-tag ${l.storage ? 'check-tag-ok' : 'check-tag-fail'}">${l.storage ? '✓ Correct storage' : '✗ Storage issue'}</span>
          </div>
        </div>`).join('');

      const footerHtml = isUnsynced ? `
        <div class="delivery-footer">
          <span class="delivery-footer-msg">⚠ Not in Sheets</span>
          <button class="btn-sync-one" id="syncbtn-${CSS.escape(key)}" onclick="syncOne('${safeKey}')">↑ Sync now</button>
        </div>` : '';

      return `
        <div class="delivery-group${isUnsynced ? ' is-unsynced' : ''}">
          <div class="delivery-header" onclick="toggleDelivery('${safeKey}')">
            <span class="delivery-chevron${isOpen ? ' open' : ''}">▶</span>
            <div class="delivery-header-body">
              <div class="delivery-header-top">
                <span class="delivery-date">${fmt(d.date)}</span>
                ${isUnsynced ? '<span class="badge badge-unsynced">Unsynced</span>' : ''}
              </div>
              <div class="delivery-meta">${d.invoice||'—'} · ${d.supplier||'—'} · ${d.staff||'—'}</div>
            </div>
            <div class="delivery-header-right">
              <span class="line-pill">${d.lines.length} line${d.lines.length !== 1 ? 's' : ''}</span>
            </div>
          </div>
          <div class="delivery-lines-wrap${isOpen ? ' open' : ''}">
            <div class="delivery-lines-inner">${linesHtml}</div>
            ${footerHtml}
          </div>
        </div>`;
    }).join('');
  }

  async function syncOne(key) {
    // Find in local deliveries
    const delivery = deliveries.find(d => deliveryKey(d) === key);
    if(!delivery) return;

    const btnId = 'syncbtn-' + CSS.escape(key);
    const btn = document.getElementById(btnId);
    if(btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }

    try {
      await syncDeliveryToSheets(delivery);
      const idx = deliveries.findIndex(d => d.id === delivery.id);
      if(idx >= 0) { deliveries[idx].synced = true; persist(); }
      // Reflect in sheetsDeliveries immediately
      if(!sheetsDeliveries.some(d => deliveryKey(d) === key)) {
        sheetsDeliveries.unshift({ ...delivery });
      }
      showToast('Delivery synced ✓');
      renderRecords();
    } catch(e) {
      if(btn) { btn.disabled = false; btn.textContent = '↑ Retry'; }
      showToast('Sync failed — check connection');
    }
  }

  async function syncAll() {
    const btn = document.getElementById('btn-sync-all');
    if(btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }

    const sheetsKeySet = new Set(sheetsDeliveries.map(deliveryKey));
    const unsynced = deliveries.filter(d => !sheetsKeySet.has(deliveryKey(d)));

    let ok = 0, fail = 0;
    for(const delivery of unsynced) {
      try {
        await syncDeliveryToSheets(delivery);
        const idx = deliveries.findIndex(d => d.id === delivery.id);
        if(idx >= 0) deliveries[idx].synced = true;
        if(!sheetsDeliveries.some(d => deliveryKey(d) === deliveryKey(delivery))) {
          sheetsDeliveries.unshift({ ...delivery });
        }
        ok++;
      } catch(e) { fail++; }
    }
    persist();
    renderRecords();
    if(btn) { btn.disabled = false; btn.textContent = 'Sync all'; }
    showToast(fail === 0 ? `All ${ok} deliveries synced ✓` : `${ok} synced, ${fail} failed`);
  }

  // ── Ingredients tab ──
  function renderIngredients() {
    const list = document.getElementById('ing-list');
    const count = document.getElementById('ing-count');

    count.textContent = ingredients.length ? `${ingredients.length} ingredient${ingredients.length !== 1 ? 's' : ''} in list` : '';
    if(!ingredients.length) {
      list.innerHTML = '<div class="ing-empty">No ingredients yet. Click "+ Add New" above.</div>';
      return;
    }

    const groups = ['Fridge', 'Freezer', 'Ambient', 'Packaging'];
    let html = '';

    groups.forEach(group => {
      const items = ingredients.filter(ing => (ing.storageType || 'Ambient') === group);
      if (items.length > 0) {
        const icon = group === 'Fridge' ? '🧊' : group === 'Freezer' ? '❄️' : group === 'Packaging' ? '🛍️' : '📦';
        html += `<div class="storage-group-label" style="margin-top: ${html === '' ? '0' : '16px'};">${icon} ${group}</div>`;
        html += items.map(ing => {
          const sups = ing.suppliers || [];
          const supHtml = sups.length
            ? sups.map(s => `<span class="supplier-tag linked">${s}</span>`).join('')
            : '<span class="supplier-tag">No suppliers linked</span>';

          const photo = ingredientPhotos[ing.name];
          const fallbackEmoji = ing.storageType === 'Packaging' ? '📦' : '🥫';

          let photoHtml = '';
          if (ing.icon && ing.icon.startsWith('http')) {
            photoHtml = `<div class="ing-item-photo"><img src="${ing.icon}" onerror="this.style.display='none'" /></div>`;
          } else if (ing.icon) {
            photoHtml = `<div class="ing-item-photo" style="font-size:24px;">${ing.icon}</div>`;
          } else if (photo) {
            photoHtml = `<div class="ing-item-photo"><img src="${photo}" onerror="this.style.display='none'" /></div>`;
          } else {
            photoHtml = `<div class="ing-item-photo">${fallbackEmoji}</div>`;
          }

          const safe = ing.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          return `<div class="ing-item">
            ${photoHtml}
            <div class="ing-item-body">
              <div class="ing-item-name">${ing.name}</div>
              <div class="ing-item-suppliers">${supHtml}</div>
            </div>
            <div class="ing-item-actions">
              <button class="btn-sm" onclick="openIngModal('${safe}')">Edit</button>
              <button class="btn-sm btn-danger-sm" onclick="deleteIngredient('${safe}')">✕</button>
            </div>
          </div>`;
        }).join('');
      }
    });

    list.innerHTML = html;
  }

  // ── Ingredient ADD/EDIT Modal ──
  function openIngModal(ingName = null) {
    editingIngredient = ingName;
    const ing = ingName ? ingredients.find(i => i.name === ingName) : null;

    document.getElementById('ing-modal-title').textContent = ingName ? 'Edit Ingredient' : 'Add Ingredient';
    document.getElementById('modal-ing-name').value = ing ? ing.name : '';
    document.getElementById('modal-ing-storage').value = ing ? (ing.storageType || 'Ambient') : 'Ambient';
    document.getElementById('modal-ing-icon').value = ing ? (ing.icon || '') : '';
    document.getElementById('modal-err-ing').style.display = 'none';

    renderModalSupplierList(ing ? (ing.suppliers || []) : []);

    document.getElementById('ing-modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('modal-ing-name').focus(), 100);
  }

  function closeIngModal() {
    document.getElementById('ing-modal-overlay').classList.remove('open');
    editingIngredient = null;
  }

  function renderModalSupplierList(selected) {
    const list = document.getElementById('modal-supplier-list');
    const combined = [...new Set([...allSuppliers, ...selected])].sort();

    if(!combined.length) {
      list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);padding:8px;text-align:center;">No suppliers yet. Add them in the Suppliers tab first.</div>';
      return;
    }

    list.innerHTML = combined.map(s => `
      <label class="supplier-check-row">
        <input type="checkbox" value="${s.replace(/"/g, '&quot;')}" ${selected.includes(s) ? 'checked' : ''} />
        <span>${s}</span>
      </label>`).join('');
  }

  async function saveModalIngredient() {
    const nameInput = document.getElementById('modal-ing-name');
    const name = nameInput.value.trim();
    const storage = document.getElementById('modal-ing-storage').value;
    const icon = document.getElementById('modal-ing-icon').value.trim();
    const checks = [...document.querySelectorAll('#modal-supplier-list input[type=checkbox]')];
    const selectedSups = checks.filter(c => c.checked).map(c => c.value);

    const err = document.getElementById('modal-err-ing');

    if(!name) { err.style.display = ''; err.textContent = 'Please enter a name.'; return; }

    if(ingredients.some(i => i.name.toLowerCase() === name.toLowerCase() && i.name !== editingIngredient)) {
      err.style.display = ''; err.textContent = `"${name}" already exists.`; return;
    }

    err.style.display = 'none';
    const btn = document.getElementById('btn-save-ing');
    btn.textContent = 'Saving…';
    btn.disabled = true;

    const payload = {
      name: name,
      oldName: editingIngredient,
      suppliers: selectedSups.join(', '),
      storageType: storage,
      icon: icon
    };

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveIngredientObj', ingredient: payload }),
        headers: { 'Content-Type': 'text/plain' }
      });
      const json = await res.json();

      if(json.result === 'success') {
        if (editingIngredient) {
          const idx = ingredients.findIndex(i => i.name === editingIngredient);
          if (idx >= 0) {
            ingredients[idx] = { name, suppliers: selectedSups, storageType: storage, icon: icon };
          }
          if (name !== editingIngredient && ingredientPhotos[editingIngredient]) {
            ingredientPhotos[name] = ingredientPhotos[editingIngredient];
            delete ingredientPhotos[editingIngredient];
          }
          lines.forEach(l => { if(l.ingredient === editingIngredient) l.ingredient = name; });
          showToast('Ingredient updated ✓');
        } else {
          ingredients.push({ name, suppliers: selectedSups, storageType: storage, icon: icon });
          showToast(name + ' added ✓');
        }

        ingredients.sort((a,b) => a.name.localeCompare(b.name));
        renderIngredients();
        renderIngPicker();
        renderLines();
        closeIngModal();
      } else {
        err.style.display = '';
        err.textContent = 'Failed to save — try again.';
      }
    } catch(e) {
      err.style.display = '';
      err.textContent = 'No connection.';
    }

    btn.textContent = 'Save Ingredient';
    btn.disabled = false;
  }

  async function deleteIngredient(name) {
    if(!confirm(`Delete "${name}"?`)) return;
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteIngredient', ingredient: name }),
        headers: { 'Content-Type': 'text/plain' }
      });
    } catch(e){}
    ingredients = ingredients.filter(i => i.name !== name);
    renderIngredients();
    showToast('Deleted');
  }

  // ── Suppliers tab ──
  function populateSupplierDropdown() {
    const sel = document.getElementById('h-supplier');
    const cur = sel.value;

    sel.innerHTML = '<option value="">Select supplier…</option>';
    allSuppliers.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sel.appendChild(opt);
    });

    if(cur) sel.value = cur;
  }

  function renderSuppliersList() {
    const list = document.getElementById('supplier-list');
    const count = document.getElementById('sup-count');
    if(!list) return;

    count.textContent = allSuppliers.length ? `${allSuppliers.length} supplier${allSuppliers.length !== 1 ? 's' : ''}` : '';
    if(!allSuppliers.length) {
      list.innerHTML = '<div class="ing-empty">No suppliers yet — add one above.</div>';
      return;
    }

    list.innerHTML = allSuppliers.map((s,i) => `
      <div class="supplier-item">
        <div class="supplier-item-name">${s}</div>
        <button class="btn-sm btn-danger-sm" onclick="deleteSupplier(${i})">✕</button>
      </div>`).join('');
  }

  async function addSupplier() {
    const input = document.getElementById('new-supplier');
    const val = input.value.trim();
    const err = document.getElementById('err-sup');

    if(!val) { err.style.display = ''; err.textContent = 'Please enter a supplier name.'; return; }
    if(allSuppliers.includes(val)) { err.style.display = ''; err.textContent = `"${val}" already exists.`; return; }

    err.style.display = 'none';
    allSuppliers.push(val);
    allSuppliers.sort();

    persistSuppliers();
    input.value = '';
    populateSupplierDropdown();
    renderSuppliersList();
    showToast(val + ' added ✓');

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveSupplier', supplier: val }),
        headers: { 'Content-Type': 'text/plain' }
      });
    } catch(e) {}
  }

  async function deleteSupplier(i) {
    const sup = allSuppliers[i];
    if(!confirm(`Remove "${sup}"?`)) return;
    allSuppliers.splice(i, 1);
    persistSuppliers();
    populateSupplierDropdown();
    renderSuppliersList();
    showToast('Removed');

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteSupplier', supplier: sup }),
        headers: { 'Content-Type': 'text/plain' }
      });
    } catch(e) {}
  }

  document.getElementById('h-date').valueAsDate = new Date();
  load();
</script>
</body>
</html>
